name: 🔒 Security & Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Chaque lundi à 2h du matin
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  MAVEN_OPTS: '-Xmx2048m -XX:MetaspaceSize=512m'
  NODE_OPTIONS: '--max-old-space-size=4096'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Job 1: Analyse de sécurité des dépendances
  dependency-security:
    name: 🔍 Sécurité Dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4

    - name: ☕ Configuration Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: 📦 Configuration Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: 🔍 Audit sécurité Backend (Maven)
      working-directory: ./backend
      run: |
        echo "🔍 Audit des dépendances Maven..."
        mvn org.owasp:dependency-check-maven:check \
          -Dformat=ALL \
          -Dout=../../reports/security/backend-dependency-check \
          -DfailBuildOnCVSS=7

    - name: 🔍 Audit sécurité Frontend (npm audit)
      working-directory: ./frontend
      run: |
        echo "🔍 Audit des dépendances npm..."
        npm audit --audit-level=high --json > ../reports/security/frontend-npm-audit.json || true
        npm audit --audit-level=high

    - name: 📊 Upload rapports sécurité
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: reports/security/
        retention-days: 90

  # Job 2: Analyse de code statique avec SonarQube
  code-analysis:
    name: 🔍 Analyse Code Statique
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ☕ Configuration Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: 📦 Configuration Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: 🔧 Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: 📥 Installation dépendances Frontend
      working-directory: ./frontend
      run: npm ci

    - name: 🏗️ Build avec tests pour SonarQube
      working-directory: ./backend
      run: |
        mvn clean compile test-compile
        mvn test -Dspring.profiles.active=test

    - name: 🔍 Analyse SonarQube Backend
      working-directory: ./backend
      run: |
        echo "🔍 Analyse SonarQube backend..."
        mvn sonar:sonar \
          -Dsonar.projectKey=medhead-backend \
          -Dsonar.organization=medhead \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
          -Dsonar.java.binaries=target/classes \
          -Dsonar.sources=src/main/java \
          -Dsonar.tests=src/test/java \
          -Dsonar.exclusions=**/generated/**,**/target/**
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🔍 Analyse SonarQube Frontend
      working-directory: ./frontend
      run: |
        echo "🔍 Analyse SonarQube frontend..."
        npx sonar-scanner \
          -Dsonar.projectKey=medhead-frontend \
          -Dsonar.organization=medhead \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.sources=src \
          -Dsonar.tests=src \
          -Dsonar.javascript.lcov.reportPaths=reports/coverage/lcov.info \
          -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/e2e/**
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Scan de vulnérabilités avec Snyk
  vulnerability-scan:
    name: 🛡️ Scan Vulnérabilités
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4

    - name: ☕ Configuration Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: 📦 Configuration Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: 📥 Installation dépendances Frontend
      working-directory: ./frontend
      run: npm ci

    - name: 🛡️ Scan Snyk Backend
      uses: snyk/actions/maven@master
      working-directory: ./backend
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --json-file-output=../../reports/security/backend-snyk.json

    - name: 🛡️ Scan Snyk Frontend
      uses: snyk/actions/node@master
      working-directory: ./frontend
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --json-file-output=../reports/security/frontend-snyk.json

    - name: 📊 Upload rapports Snyk
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: snyk-reports
        path: reports/security/
        retention-days: 90

  # Job 4: Analyse SAST (Static Application Security Testing)
  sast-analysis:
    name: 🔍 Analyse SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ☕ Configuration Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: 📦 Configuration Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: 🔍 Analyse SAST avec CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java, javascript

    - name: 🔍 Build pour CodeQL
      working-directory: ./backend
      run: mvn clean compile

    - name: 🔍 Analyse CodeQL
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java,javascript"

    - name: 📊 Upload rapports SAST
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sast-reports
        path: reports/security/
        retention-days: 90

  # Job 5: Scan des secrets et configuration
  secrets-scan:
    name: 🔐 Scan Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4

    - name: 🔐 Scan des secrets avec TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

    - name: 🔐 Scan des secrets avec GitLeaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Job 6: Analyse de conformité et standards
  compliance-check:
    name: 📋 Conformité & Standards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4

    - name: ☕ Configuration Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: 📦 Configuration Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: 📋 Vérification standards Java (Checkstyle)
      working-directory: ./backend
      run: |
        echo "📋 Vérification Checkstyle..."
        mvn checkstyle:checkstyle || true
        mvn checkstyle:check || true

    - name: 📋 Vérification standards JavaScript (ESLint)
      working-directory: ./frontend
      run: |
        echo "📋 Vérification ESLint..."
        npx eslint src/ --format json --output-file ../reports/security/frontend-eslint.json || true
        npx eslint src/ || true

    - name: 📋 Vérification des licences
      run: |
        echo "📋 Vérification des licences..."
        
        # Backend
        cd backend
        mvn license:check || true
        
        # Frontend
        cd ../frontend
        npx license-checker --json > ../reports/security/frontend-licenses.json || true
        npx license-checker || true

    - name: 📊 Upload rapports conformité
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: compliance-reports
        path: reports/security/
        retention-days: 90

  # Job 7: Tests de sécurité DAST (Dynamic Application Security Testing)
  dast-testing:
    name: 🌐 Tests DAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4

    - name: ☕ Configuration Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: 📦 Configuration Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: 🐳 Démarrage des services pour tests DAST
      run: |
        echo "🐳 Démarrage des services pour tests DAST..."
        docker compose -f ./docker/docker-compose.yml up -d
        
        echo "⏳ Attente du démarrage..."
        sleep 60
        
        echo "🔍 Vérification des services..."
        docker compose -f ./docker/docker-compose.yml ps

    - name: 🌐 Tests DAST avec OWASP ZAP
      uses: zaproxy/action-full-scan@v0.4.0
      with:
        target: 'http://localhost:4200'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'

    - name: 🌐 Tests DAST avec OWASP ZAP Backend
      uses: zaproxy/action-full-scan@v0.4.0
      with:
        target: 'http://localhost:8080'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'

    - name: 📊 Upload rapports DAST
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dast-reports
        path: |
          reports/zap-results/
        retention-days: 90

    - name: 🧹 Nettoyage
      if: always()
      run: docker compose -f ./docker/docker-compose.yml down -v

  # Job 8: Rapport de sécurité consolidé
  security-summary:
    name: 📊 Rapport Sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [dependency-security, code-analysis, vulnerability-scan, sast-analysis, secrets-scan, compliance-check]
    if: always()
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4

    - name: 📊 Download all security reports
      uses: actions/download-artifact@v4
      if: always()

    - name: 📊 Génération rapport sécurité consolidé
      run: |
        echo "📊 Génération du rapport de sécurité consolidé..."
        mkdir -p reports/security-summary
        
        cat > reports/security-summary/security-report.html << 'EOF'
        <!DOCTYPE html>
        <html lang="fr">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Rapport Sécurité - MedHead</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
                .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
                .header { text-align: center; color: #2c3e50; border-bottom: 3px solid #e74c3c; padding-bottom: 20px; margin-bottom: 30px; }
                .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
                .card { background: #ecf0f1; padding: 20px; border-radius: 8px; text-align: center; }
                .success { color: #27ae60; }
                .warning { color: #f39c12; }
                .error { color: #e74c3c; }
                .info { color: #3498db; }
            </style>
        </head>
        <body>
            <div class="container">
                <div class="header">
                    <h1>🔒 Rapport Sécurité MedHead</h1>
                    <p>Analyse de sécurité et qualité du code</p>
                    <p>Généré le: $(date '+%d/%m/%Y à %H:%M:%S')</p>
                </div>
                
                <div class="summary">
                    <div class="card">
                        <h3>🔍 Dépendances</h3>
                        <div class="${{ needs.dependency-security.result == 'success' && 'success' || 'error' }}">${{ needs.dependency-security.result }}</div>
                    </div>
                    <div class="card">
                        <h3>🔍 Analyse Code</h3>
                        <div class="${{ needs.code-analysis.result == 'success' && 'success' || 'error' }}">${{ needs.code-analysis.result }}</div>
                    </div>
                    <div class="card">
                        <h3>🛡️ Vulnérabilités</h3>
                        <div class="${{ needs.vulnerability-scan.result == 'success' && 'success' || 'error' }}">${{ needs.vulnerability-scan.result }}</div>
                    </div>
                    <div class="card">
                        <h3>🔍 SAST</h3>
                        <div class="${{ needs.sast-analysis.result == 'success' && 'success' || 'error' }}">${{ needs.sast-analysis.result }}</div>
                    </div>
                    <div class="card">
                        <h3>🔐 Secrets</h3>
                        <div class="${{ needs.secrets-scan.result == 'success' && 'success' || 'error' }}">${{ needs.secrets-scan.result }}</div>
                    </div>
                    <div class="card">
                        <h3>📋 Conformité</h3>
                        <div class="${{ needs.compliance-check.result == 'success' && 'success' || 'error' }}">${{ needs.compliance-check.result }}</div>
                    </div>
                </div>
                
                <div class="info">
                    <h2>📁 Rapports Détaillés</h2>
                    <ul>
                        <li>🔍 Audit des dépendances</li>
                        <li>🔍 Analyse SonarQube</li>
                        <li>🛡️ Scan Snyk</li>
                        <li>🔍 Analyse SAST CodeQL</li>
                        <li>🔐 Scan des secrets</li>
                        <li>📋 Vérification conformité</li>
                    </ul>
                </div>
            </div>
        </body>
        </html>
        EOF

    - name: 📊 Upload rapport sécurité
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-summary-report
        path: reports/security-summary/
        retention-days: 90

    - name: 📢 Notification sécurité
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#medhead-security'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        custom_payload: |
          {
            "text": "🔒 Rapport Sécurité MedHead",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*🔒 Rapport Sécurité MedHead*\n\n*Status:* ${{ job.status }}\n*Commit:* `${{ github.sha }}`\n*Branch:* ${{ github.ref_name }}\n\n*Analyses:*\n• Dépendances: ${{ needs.dependency-security.result }}\n• Code: ${{ needs.code-analysis.result }}\n• Vulnérabilités: ${{ needs.vulnerability-scan.result }}\n• SAST: ${{ needs.sast-analysis.result }}\n• Secrets: ${{ needs.secrets-scan.result }}\n• Conformité: ${{ needs.compliance-check.result }}"
                }
              }
            ]
          }
