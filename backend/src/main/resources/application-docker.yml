# Configuration spécifique pour Docker
spring:
  profiles:
    active: docker
  
  # Désactiver les métriques système problématiques dans Docker
  management:
    metrics:
      system:
        enabled: false
      jvm:
        enabled: true
      process:
        enabled: false
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: when-authorized

# Configuration de la base de données pour Docker
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/medhead_db
    username: medhead_user
    password: medhead_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Configuration du serveur
server:
  port: 8080

# Configuration de logging
logging:
  level:
    com.medhead.poc: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
