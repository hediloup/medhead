# Configuration pour l'environnement de production avec PostgreSQL
# Base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/medhead_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=medhead_user
spring.datasource.password=medhead_password

# Configuration de la connexion
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA/Hibernate pour PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Configuration de la validation
spring.jpa.properties.hibernate.validator.fail_fast=true

# Logging de production (moins verbeux)
logging.level.org.springframework.web=WARN
logging.level.com.medhead.poc=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Configuration de sécurité
server.port=8082
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Configuration de l'application
spring.application.name=medhead-api

# Configuration de la base de données pour les migrations (si utilisées)
spring.liquibase.enabled=false
spring.flyway.enabled=false

# Configuration de la sérialisation JSON
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false
