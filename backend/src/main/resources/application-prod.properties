# Configuration pour l'environnement de production avec PostgreSQL
spring.application.name=poc

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/medhead_db
spring.datasource.username=medhead_user
spring.datasource.password=medhead_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Les données d'hôpitaux sont chargées via le script Docker init-scripts/01-init-database.sql
# Pas besoin de spring.sql.init en production car la base est déjà initialisée

# Configuration du serveur
server.port=8080

# Configuration de sécurité
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Configuration Actuator (monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Logging
logging.level.com.medhead.poc=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Configuration de la base de données - Optimisations de performance
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Pool de connexions HikariCP optimisé
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Désactiver la détection de fuites en production (coût non négligeable)
# spring.datasource.hikari.leak-detection-threshold=60000

# Configuration Tomcat optimisée
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=40
server.tomcat.max-connections=20000
server.tomcat.accept-count=2000
server.tomcat.connection-timeout=10000
server.tomcat.keep-alive-timeout=20000
server.tomcat.max-keep-alive-requests=10000

# Configuration pour les requêtes géospatiales (désactivé temporairement)
# spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect
# spring.jpa.properties.hibernate.spatial.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect

# --- Optimisations latence/réseau ---
# Compression HTTP pour réduire la taille des réponses JSON
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Activer HTTP/2 (TLS requis en prod) pour améliorer la latence
server.http2.enabled=true

# Respect des en-têtes proxy (X-Forwarded-*) si derrière un reverse proxy
server.forward-headers-strategy=framework

# --- Optimisations JPA/Hibernate ---
# Eviter les lazy loads pendant le rendu web, réduit le temps bloqué côté thread web
spring.jpa.open-in-view=false
# Tailles de fetch pour limiter les allers-retours DB sur les associations
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- MVC/Async ---
# Délai des requêtes async (si contrôleurs @Async/WebFlux ne s'appliquent pas)
spring.mvc.async.request-timeout=30000

