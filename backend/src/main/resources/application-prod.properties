# Configuration pour l'environnement de production avec PostgreSQL
spring.application.name=poc

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/medhead_db
spring.datasource.username=medhead_user
spring.datasource.password=medhead_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Les données d'hôpitaux sont chargées via le script Docker init-scripts/01-init-database.sql
# Pas besoin de spring.sql.init en production car la base est déjà initialisée

# Configuration du serveur
server.port=8080

# Configuration de sécurité
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Configuration Actuator (monitoring)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=50ms,100ms,200ms,500ms,1s,2s,5s

# Logging optimisé pour la performance
logging.level.com.medhead.poc=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.hikari=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Configuration de la base de données - Optimisations de performance pour 800 RPS
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=100

# Pool de connexions HikariCP optimisé pour 800 RPS
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=25
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=MedHeadPool

# Configuration Tomcat optimisée pour 800 RPS
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.max-connections=20000
server.tomcat.accept-count=2000
server.tomcat.connection-timeout=10000
server.tomcat.keep-alive-timeout=30000
server.tomcat.max-keep-alive-requests=100
server.tomcat.processor-cache=200

# Configuration pour les requêtes géospatiales (désactivé temporairement)
# spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect
# spring.jpa.properties.hibernate.spatial.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect

# Configuration Google Maps avec timeout optimisé
google.maps.api.key=AIzaSyA6EicRUZ_a2YTAuB1ZFWWXB6yOaqnKyB0
google.maps.directions.url=https://maps.googleapis.com/maps/api/directions/json
google.maps.timeout=5000
google.maps.retry-attempts=2

# Configuration de cache pour améliorer les performances
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s

