# Configuration pour l'environnement de production avec PostgreSQL
spring.application.name=poc

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/medhead_db
spring.datasource.username=medhead_user
spring.datasource.password=medhead_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Les données d'hôpitaux sont chargées via le script Docker init-scripts/01-init-database.sql
# Pas besoin de spring.sql.init en production car la base est déjà initialisée

# Configuration du serveur
server.port=8080
server.http2.enabled=true
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain

# Configuration de sécurité
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Configuration Actuator (monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Logging
logging.level.com.medhead.poc=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Configuration de la base de données - Optimisations de performance
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Pool de connexions HikariCP optimisé (haute performance)
spring.datasource.hikari.maximum-pool-size=80
spring.datasource.hikari.minimum-idle=40
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1700000
spring.datasource.hikari.leak-detection-threshold=60000

# Configuration Tomcat optimisée
server.tomcat.threads.max=250
server.tomcat.threads.min-spare=25
server.tomcat.max-connections=15000
server.tomcat.accept-count=2000
server.tomcat.connection-timeout=20000

