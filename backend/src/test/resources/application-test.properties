# Configuration pour les tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration H2 pour les tests
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Désactiver l'initialisation automatique des données pour les tests
spring.sql.init.enabled=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Configuration pour éviter les problèmes de sécurité dans les tests
spring.security.user.name=test
spring.security.user.password=test

# Désactiver les endpoints de management pour les tests
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# Configuration Google Maps pour les tests (mock)
google.maps.api.key=test-key
google.maps.api.url=http://localhost:8080/mock-maps-api
