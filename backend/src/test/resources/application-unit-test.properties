# Configuration spécifique pour les tests unitaires
# Ces tests n'ont pas besoin de base de données ni de contexte Spring complet

# Désactiver complètement l'initialisation de la base de données
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

# Configuration minimale pour les tests unitaires
spring.main.web-application-type=none
spring.main.lazy-initialization=true

# Désactiver la sécurité pour les tests unitaires
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Configuration des logs pour les tests unitaires
logging.level.com.medhead=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Configuration JPA minimale (si nécessaire)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
