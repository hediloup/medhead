# Configuration Cucumber pour les tests BDD
cucumber.plugin=pretty, json:target/cucumber-reports/cucumber.json, html:target/cucumber-reports/cucumber.html
cucumber.publish.quiet=true
cucumber.glue=com.medhead.poc.bdd.steps
cucumber.features=src/test/resources/features

# Configuration des rapports
cucumber.reporting.publish.enabled=false
cucumber.reporting.publish.quiet=true

# Configuration de la langue (français)
cucumber.publish.enabled=false

# Configuration des hooks
cucumber.hooks.order=before,after

# Configuration du timeout par défaut (en millisecondes)
cucumber.step.timeout=30000

# Configuration des tags par défaut
cucumber.filter.tags=not @ignore

# Configuration des formats de sortie
cucumber.plugin.pretty.indent=true
cucumber.plugin.pretty.monochrome=true

# Configuration des features
cucumber.features.encoding=UTF-8

# Configuration des steps
cucumber.glue.strict=true
