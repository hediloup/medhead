version: '3.8'

services:
  # Base de données PostgreSQL avec haute disponibilité
  medhead-postgres:
    image: postgres:15
    container_name: medhead-postgres-production
    environment:
      POSTGRES_DB: medhead_db
      POSTGRES_USER: medhead_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data_production:/var/lib/postgresql/data
      - ./postgres.production.conf:/etc/postgresql/postgresql.conf:ro
      - ./ssl/postgres:/var/lib/postgresql/ssl:ro
    networks:
      - medhead-network-production
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medhead_user -d medhead_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend Spring Boot avec scaling horizontal
  medhead-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/medhead/medhead-backend:latest}
    container_name: medhead-backend-production
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://medhead-postgres:5432/medhead_db?sslmode=require
      SPRING_DATASOURCE_USERNAME: medhead_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: false
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SERVER_PORT: 8080
      SERVER_SSL_ENABLED: true
      SERVER_SSL_KEY_STORE: /app/ssl/keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD}
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: when_authorized
      MANAGEMENT_SECURITY_ENABLED: true
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH: /actuator
      LOGGING_LEVEL_COM_MEDHEAD: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
      LOGGING_FILE_NAME: /app/logs/medhead-backend.log
      LOGGING_FILE_MAX_SIZE: 100MB
      LOGGING_FILE_MAX_HISTORY: 30
      # Configuration production
      CORS_ALLOWED_ORIGINS: https://medhead.com,https://www.medhead.com
      CACHE_TTL: 600
      RATE_LIMIT_REQUESTS: 10000
      RATE_LIMIT_WINDOW: 3600
      # Monitoring et métriques
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: true
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_STEP: 10s
      # Sécurité
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400
    ports:
      - "8080:8080"
    networks:
      - medhead-network-production
    depends_on:
      medhead-postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - backend_logs:/app/logs
      - ./ssl/backend:/app/ssl:ro
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.3
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend Angular avec CDN et cache
  medhead-frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/medhead/medhead-frontend:latest}
    container_name: medhead-frontend-production
    ports:
      - "4200:80"
    networks:
      - medhead-network-production
    depends_on:
      medhead-backend:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - frontend_logs:/var/log/nginx
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.3
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy avec SSL et load balancing
  nginx:
    image: nginx:alpine
    container_name: medhead-nginx-production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - medhead-network-production
    depends_on:
      - medhead-frontend
      - medhead-backend
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis pour le cache distribué
  redis:
    image: redis:7-alpine
    container_name: medhead-redis-production
    ports:
      - "6379:6379"
    networks:
      - medhead-network-production
    restart: unless-stopped
    volumes:
      - redis_data_production:/data
      - ./redis.production.conf:/etc/redis/redis.conf:ro
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["redis-server", "/etc/redis/redis.conf"]

  # Monitoring avec Prometheus haute disponibilité
  prometheus:
    image: prom/prometheus:latest
    container_name: medhead-prometheus-production
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_production:/prometheus
      - ./ssl/prometheus:/etc/prometheus/ssl:ro
    networks:
      - medhead-network-production
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.wal-compression'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana pour les dashboards de production
  grafana:
    image: grafana/grafana:latest
    container_name: medhead-grafana-production
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SECURITY_DISABLE_GRAVATAR: true
      GF_SECURITY_COOKIE_SECURE: true
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SERVER_ROOT_URL: https://grafana.medhead.com
      GF_SERVER_CERT_FILE: /etc/grafana/ssl/cert.pem
      GF_SERVER_CERT_KEY: /etc/grafana/ssl/key.pem
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: medhead-postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana_user
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: require
    volumes:
      - grafana_data_production:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ssl/grafana:/etc/grafana/ssl:ro
    networks:
      - medhead-network-production
    depends_on:
      - prometheus
      - medhead-postgres
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # AlertManager pour les alertes
  alertmanager:
    image: prom/alertmanager:latest
    container_name: medhead-alertmanager-production
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.production.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data_production:/alertmanager
    networks:
      - medhead-network-production
    depends_on:
      - prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alerts.medhead.com'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_production:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/medhead/data/postgres
  backend_logs:
    driver: local
  frontend_logs:
    driver: local
  nginx_logs:
    driver: local
  redis_data_production:
    driver: local
  prometheus_data_production:
    driver: local
  grafana_data_production:
    driver: local
  alertmanager_data_production:
    driver: local

networks:
  medhead-network-production:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
    driver_opts:
      com.docker.network.bridge.name: medhead-prod
