version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: medhead-postgres
    environment:
      POSTGRES_DB: medhead_db
      POSTGRES_USER: medhead_user
      POSTGRES_PASSWORD: medhead_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./postgres.conf:/etc/postgresql/postgresql.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - medhead-network
    restart: unless-stopped

  # Backend Spring Boot
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: medhead-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/medhead_db
      SPRING_DATASOURCE_USERNAME: medhead_user
      SPRING_DATASOURCE_PASSWORD: medhead_password
      GOOGLE_MAPS_API_KEY: AIzaSyA6EicRUZ_a2YTAuB1ZFWWXB6yOaqnKyB0
    ports:
      - "8080:8080"
    networks:
      - medhead-network
    depends_on:
      - postgres
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4

  # Frontend Angular
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: medhead-frontend
    ports:
      - "4200:80"
    environment:
      - NODE_ENV=production
    networks:
      - medhead-network
    depends_on:
      - backend
    restart: unless-stopped

  # Frontend pour les tests (développement)
  frontend-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.test
    container_name: medhead-frontend-dev
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
      - CHROME_BIN=/usr/bin/chromium-browser
      - DISPLAY=:99
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/cypress:/app/cypress
      - ../frontend/reports:/app/reports
    networks:
      - medhead-network
    depends_on:
      - backend
    command: npm start
    profiles:
      - dev
      - test

  # Tests unitaires frontend
  frontend-unit-tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.test
    container_name: medhead-frontend-unit-tests
    environment:
      - NODE_ENV=test
      - CHROME_BIN=/usr/bin/chromium-browser
      - CI=true
    volumes:
      - ../frontend/reports:/app/reports
    networks:
      - medhead-network
    command: npm run test:coverage -- --watch=false --browsers=ChromeHeadless
    profiles:
      - test

  # Tests E2E frontend
  frontend-e2e-tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.test
    container_name: medhead-frontend-e2e-tests
    environment:
      - NODE_ENV=test
      - CHROME_BIN=/usr/bin/chromium-browser
      - DISPLAY=:99
      - CI=true
    volumes:
      - ../frontend/reports:/app/reports
    networks:
      - medhead-network
    depends_on:
      - frontend
    command: ./run-tests.sh e2e
    profiles:
      - test

  # Tests complets frontend
  frontend-all-tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.test
    container_name: medhead-frontend-all-tests
    environment:
      - NODE_ENV=test
      - CHROME_BIN=/usr/bin/chromium-browser
      - DISPLAY=:99
      - CI=true
    volumes:
      - ../frontend/reports:/app/reports
    networks:
      - medhead-network
    depends_on:
      - frontend
    command: ./run-tests-ci.sh
    profiles:
      - test

  # Optionnel: pgAdmin pour administration
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medhead-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medhead.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - medhead-network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  medhead-network:
    driver: bridge
