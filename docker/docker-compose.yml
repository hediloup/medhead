version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medhead-postgres
    environment:
      POSTGRES_DB: medhead_db
      POSTGRES_USER: medhead_user
      POSTGRES_PASSWORD: medhead_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./postgres.conf:/etc/postgresql/postgresql.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - medhead-network
    restart: unless-stopped

  # Optionnel: pgAdmin pour administration
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medhead-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medhead.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - medhead-network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  medhead-network:
    driver: bridge
