# Configuration SonarQube pour le frontend MedHead
# Ce fichier est utilisé par sonar-scanner pour analyser le code Angular/TypeScript

# Informations du projet
sonar.projectKey=medhead-frontend
sonar.organization=medhead
sonar.projectName=MedHead Frontend
sonar.projectVersion=1.0.0

# Configuration du serveur (sera remplacé par les variables d'environnement)
sonar.host.url=${env.SONAR_HOST_URL}
sonar.login=${env.SONAR_TOKEN}

# Sources à analyser
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Exclusions (fichiers à ignorer)
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/e2e/**,**/cypress/**,**/.angular/**

# Tests
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Couverture de code
sonar.javascript.lcov.reportPaths=coverage/medhead-frontend/lcov.info

# Configuration spécifique TypeScript/Angular
sonar.typescript.tsconfigPath=tsconfig.json
sonar.typescript.node=node

# Métriques de qualité
sonar.qualitygate.wait=true

# Configuration des règles
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignorer les fichiers de configuration
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1128
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.config.js

# Ignorer les fichiers de test pour certaines règles
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.spec.ts

# Ignorer les fichiers de configuration Angular
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S1128
sonar.issue.ignore.multicriteria.e3.resourceKey=**/angular.json,**/karma.conf.js,**/cypress.config.js

# Configuration des plugins
sonar.javascript.file.suffixes=.js,.ts
sonar.typescript.file.suffixes=.ts

# Exclusions supplémentaires pour les fichiers générés
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/e2e/**,**/cypress/**,**/.angular/**,**/*.spec.ts,**/*.test.ts
